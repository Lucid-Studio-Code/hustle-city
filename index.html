</head><body><div id="ld">Chargement de Hustle City…</div>
<script>
// Hustle City se met à jour tout seul : à chaque ouverture, on charge la dernière version publiée sur GitHub
// (la partie reste dans ce navigateur, rien n'est perdu). Sans internet, ou avec ?local à la fin de l'adresse : la version de ce dossier.
(async () => {
  const REPO = 'Lucid-Studio-Code/hustle-city';
  const local = () => { location.replace('game.html' + location.hash); };
  // en ligne (GitHub Pages) le site est déjà à jour : on joue directement la page du site
  // le jeu se lance toujours depuis ses propres fichiers : sur ton Mac (les plus récents) comme sur le serveur du jeu
  if (!/[?&]github\b/.test(location.search)) return local();
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 6000);
    const r = await fetch(`https://api.github.com/repos/${REPO}/commits/main`, { signal: ctl.signal, headers: { Accept: 'application/vnd.github.sha' } });
    if (!r.ok) throw new Error('github ' + r.status);
    const sha = (await r.text()).trim().slice(0, 40);
    const cdn = `https://cdn.jsdelivr.net/gh/${REPO}@${sha}/`, raw = `https://raw.githubusercontent.com/${REPO}/${sha}/`;
    // la page vient de raw.githubusercontent (rapide) ; game.html charge ensuite le code, et les images viennent du dossier local
    const html = await (await fetch(raw + 'game.html', { signal: ctl.signal })).text();
    if (!html.includes('id="app"')) throw new Error('page vide');
    document.open();
    document.write('<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><base href="' + cdn + '">' + html.replace(/<!doctype html>/i, '') + '</html>');
    document.close();
  } catch (e) { console.warn('Mise à jour impossible, version locale :', e); local(); }
})();
</script></body></html>
