<!doctype html>
<html lang="fr"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Hustle City</title>
  <meta name="description" content="Paris sportifs, casino, crypto et objets de collection : deviens riche. Facilement. Ou pas.">
  <meta name="theme-color" content="#1b1433">
  <link rel="preload" href="assets/fonts/lilita-latin.woff2" as="font" type="font/woff2" crossorigin>
  <div id="app" data-sign="ground">
    <section id="scene-city" class="scene">
      <div id="map"><div id="map-inner"></div></div>
    </section>
    <section id="scene-appart" class="scene hidden"></section>

    <header id="hud">
      <div class="hud-row">
        <button class="avatar" data-act="profile" aria-label="Profil">
          <span class="avatar-img" id="avatar-img"></span>
          <span class="lvl" id="lvl">1</span>
        </button>
        <div class="who">
          <b id="hud-name"></b>
          <div class="xpbar"><div class="xpfill" id="xpfill"></div><span id="xptext"></span></div>
        </div>
        <div class="pill" id="pill-cash"><i class="ic" data-icon="cash"></i><span id="cash">0</span></div>
        <div class="pill gold" id="pill-lingots"><i class="ic" data-icon="lingot"></i><span id="lingots">0</span><button class="plus" data-act="promo" data-id="vip" aria-label="Acheter des lingots"></button></div>
        <button class="round" data-act="settings" aria-label="Réglages"><i class="ic" data-icon="gear"></i></button>
      </div>
      <div class="hud-row2">
        <button id="mood" data-act="moodInfo"></button>
        <div id="ticker"></div>
        <button id="worth" data-act="wallet"><small>Patrimoine</small><b id="worth-v">0<i class="cur"></i></b></button>
      </div>
    </header>

    <div id="quest" class="hidden" data-act="quest"></div>
    <div id="buffs"></div>
    <button id="trophy" data-act="rewards" aria-label="Récompenses"><i class="ic" data-icon="trophy"></i><span class="badge ok hidden"></span></button>
    <button id="btn-booster" data-act="boosters" aria-label="Boosters"><i class="bst-mini"><img src="assets/img/booster-pack.png" alt=""></i><b>Booster</b><span class="badge ok hidden"></span></button>
    <button id="btn-gift" data-act="daily" aria-label="Cadeau du jour"><i class="ic" data-icon="gift"></i><b>Cadeau</b><span class="badge ok hidden">!</span></button>
    <button id="btn-next" class="hidden" data-act="nextBuy" aria-label="Momo"><span class="nx-pic"></span><b></b><span class="badge ok hidden">!</span></button>
    <button id="next-tip" data-act="nextBuy"></button>
    <button id="next-cap" class="hidden" data-act="nextCap" aria-label="Prochain déblocage"></button>
    <button id="btn-upg" data-act="upgrades" aria-label="Améliorer mon setup"><i class="upg-ic"><img src="assets/img/btn-setup.png" alt=""></i><svg class="upg-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L22 13 H16 V22 H8 V13 H2 Z" fill="#5fc73a" stroke="#2a1a10" stroke-width="2" stroke-linejoin="round"/></svg><span class="badge ok hidden">!</span></button>
    <button id="btn-promo" data-act="promo" aria-label="Promos"><span class="pr-rib">PROMO</span><i class="pr-ic">💎</i><b id="promo-t"></b></button>
    <button id="btn-deal" class="hidden" data-act="deal" aria-label="Bon plan"></button>
    <button id="phone-btn" data-act="phone" aria-label="Téléphone"><i class="ph-mini"><i></i></i><b>Tél.</b><span class="badge hidden"></span></button>

    <nav id="bottom">
      <button class="bigbtn" data-act="boutique"><i class="ic" data-icon="shop"></i><b>Boutique</b></button>
      <button class="bigbtn" data-act="mybets"><i class="ic" data-icon="ticket"></i><b>Mes paris</b><span class="badge hidden" id="badge-bets"></span></button>
      <button class="bigbtn" data-act="wallet"><i class="ic" data-icon="wallet"></i><b>Portefeuille</b></button>
      <button class="bigbtn main" data-act="toggleScene" id="btn-scene"><i class="ic" data-icon="home"></i><b>Appart</b><span class="badge hidden" id="badge-rig">!</span></button>
    </nav>

    <div id="modal" class="hidden"></div>
    <div id="fx"></div>
    <div id="toast"></div>
    <div id="start" class="loading">
      <style>
        #start.loading { background: radial-gradient(circle at 50% 38%, #3a2470, #1b1433 70%); justify-content: center; gap: 26px; }
        #start.loading .ld-logo { font: 400 54px/0.9 'Lilita One', 'Lilita', system-ui, sans-serif; color: #ffd23f; text-align: center; -webkit-text-stroke: 3px #2a1a10; paint-order: stroke fill; text-shadow: 0 6px 0 #2a1a10; transform: rotate(-4deg); }
        #start.loading .ld-logo span { display: block; color: #fff; text-shadow: 0 6px 0 #2a1a10, 0 0 26px #ff3cac; }
        #start.loading .ld-bar { width: min(76%, 300px); height: 22px; border: 3px solid #2a1a10; border-radius: 14px; background: #2b1d4f; overflow: hidden; box-shadow: 0 4px 0 #2a1a10; }
        #start.loading .ld-fill { height: 100%; width: 0; background: linear-gradient(#8cf06a, #3fb82e); border-radius: 10px; box-shadow: inset 0 3px 0 rgba(255,255,255,.35); transition: width .15s linear; }
        #start.loading .ld-bar { position: relative; }
        #start.loading .ld-pct { position: absolute; inset: 0; display: grid; place-items: center; font: 900 13px system-ui, sans-serif; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
        #start.loading .ld-txt { min-height: 40px; max-width: 300px; margin: -12px 0 0; padding: 0 16px; color: #e6dcff; font: 800 14px/1.35 system-ui, sans-serif; text-align: center; transition: opacity .25s; }
      </style>
      <div class="ld-logo">HUSTLE<span>CITY</span></div>
      <div class="ld-bar"><div class="ld-fill"></div><b class="ld-pct">0 %</b></div>
      <p class="ld-txt"></p>
      <script>
      // écran de chargement : la barre avance pendant le chargement du code, puis des images (UI la termine)
      window.HC_LOAD = (function () {
        var el = document.getElementById('start'), fill = el.querySelector('.ld-fill'), txt = el.querySelector('.ld-txt');
        var L = ['Momo recompte les billets…', 'On chauffe la machine à crypto…', 'On graisse la roulette…', 'Négociation avec le videur…', 'On repasse le survêt…',
          'Calcul des cotes (arrondies à notre avantage)…', 'On cire les sneakers…', 'Le Kiosque imprime les tuyaux du jour…', 'On lustre les lingots…',
          'Réveil des pigeons du PigeonCoin…', 'On cache le fromage du KebabCoin…', 'Le bus est en retard, comme d\'hab…', 'On allume les néons du Lucky Palace…',
          'On mélange les boosters…', 'Le patron du Royal compte la caisse…', 'On dépoussière les montres de la Bijouterie…', 'On gare les bolides au Garage…'];
        L.sort(function () { return Math.random() - .5; });
        var p = 0, target = .04, t0 = Date.now(), i = 0, cb = null, real = false, pct = el.querySelector('.ld-pct');
        var say = function () { txt.style.opacity = 0; setTimeout(function () { txt.textContent = L[i++ % L.length]; txt.style.opacity = 1; }, 250); };
        txt.textContent = L[i++]; var rot = setInterval(say, 1600);
        var tick = setInterval(function () {
          if (!cb && !real) target += (.12 - target) * .02;   // le code se charge ; ensuite la barre suit les vraies images chargées
          p += (target - p) * .25; fill.style.width = (p * 100).toFixed(1) + '%';
          if (cb && p > .985) { clearInterval(tick); clearInterval(rot); fill.style.width = '100%'; var f = cb; cb = null; setTimeout(f, 120); }
        }, 60);
        return { set: function (f, n, tot) { real = true; target = Math.max(target, .12 + .87 * f); if (pct && tot) pct.textContent = Math.round(f * 100) + ' %'; }, done: function (f) { target = 1; cb = f; if (pct) pct.textContent = '100 %'; } };
      })();
      </script>
    </div>
  </div>

  <script>
  // Chargement du jeu. En local : les fichiers du dossier. Mis à jour depuis internet (index.html) : le code vient
  // de raw.githubusercontent (rapide et toujours à jour), les images du dossier local quand on joue sur son ordi.
  (function () {
    var V = '?v=296', FILES = ['js/layout.js', 'js/data.js', 'js/assets.js', 'js/game.js', 'js/audio.js', 'js/ui.js', 'js/casino.js', 'js/scratch.js', 'js/balto.js', 'js/agence.js', 'js/tuto.js', 'js/online.js', 'js/push.js'].slice(), CSS = 'css/style.css';
    var m = document.baseURI.match(/^https:\/\/cdn\.jsdelivr\.net\/gh\/([^@]+)@([^/]+)\//);
    if (!m) {
      document.write('<link rel="stylesheet" href="' + CSS + V + '">');
      // les placements publiés depuis le back-office doivent se voir tout de suite : layout.js n'est jamais pris en cache
      FILES.forEach(function (f) { document.write('<script src="' + f + V + (f === 'js/layout.js' ? '&t=' + Date.now() : '') + '"><\/script>'); });
      return;
    }
    var raw = 'https://raw.githubusercontent.com/' + m[1] + '/' + m[2] + '/';
    var local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? location.origin + '/' : raw;
    var get = function (f) { return fetch(raw + f).then(function (r) { if (!r.ok) throw new Error(f); return r.text(); }); };
    Promise.all([get(CSS)].concat(FILES.map(get))).then(function (t) {
      var st = document.createElement('style'); st.textContent = t[0].replace(/url\(\.\.\//g, 'url(' + local); document.head.appendChild(st);
      t.slice(1).forEach(function (code, i) { var sc = document.createElement('script'); sc.textContent = code + '\n//# sourceURL=' + FILES[i]; document.body.appendChild(sc); });
    }).catch(function (e) {
      console.warn('Code en ligne indisponible, on prend le CDN', e);
      document.head.insertAdjacentHTML('beforeend', '<link rel="stylesheet" href="' + CSS + V + '">');
      (function next(i) { if (i >= FILES.length) return; var sc = document.createElement('script'); sc.src = FILES[i] + V; sc.onload = function () { next(i + 1); }; document.body.appendChild(sc); })(0);
    });
  })();
  </script>
